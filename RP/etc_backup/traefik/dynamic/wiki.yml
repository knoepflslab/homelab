http:
  routers:
    wiki:
      rule: Host(`wiki.homelab.dataflowlab.cloud`)
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt 
      service: wiki
      middlewares:
        - authelia
      priority: 10

  services:
    wiki:
      loadBalancer:
        servers:
          - url: "http://192.168.1.67:3000"

