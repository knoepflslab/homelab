http:
  routers:
    authelia-portal:
      rule: Host(`auth.homelab.dataflowlab.cloud`)
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: authelia-portal
      priority: 1000

  services:
    authelia-portal:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9091"

